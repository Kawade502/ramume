<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6eedc" />
    <title>ラムネ</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <h1 class="title">ラムネ</h1>
    <div class="hint" id="hint" data-state="sealed">
      <p class="sealed">キャップを押し下げて、ビー玉を落とそう</p>
      <p class="open">シュワッ。<button type="button" id="again">新しい瓶</button></p>
      <p class="sub keys">ドラッグで回す ・ <kbd>P</kbd> 開ける ・ <kbd>R</kbd> 新しい瓶 ・ <kbd>Space</kbd> 回転</p>
      <p class="sub touch">キャップをタップしても開くよ ・ ドラッグで回す</p>
    </div>
    <p class="error" id="error" hidden>この端末では WebGL2 が使えないため表示できません。</p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
