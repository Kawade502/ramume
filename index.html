<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6eedc" />
    <title>ラムネ</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <h1 class="title">ラムネ</h1>
    <button type="button" class="mute" id="mute" aria-pressed="false" aria-label="音を消す">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="speaker" d="M4 9h3l5-4v14l-5-4H4z" />
        <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" />
        <path class="cross" d="M16 9l6 6M22 9l-6 6" />
      </svg>
    </button>
    <button type="button" class="tilt" id="tilt" aria-pressed="false" aria-label="スマホの傾きで瓶を傾ける" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="3" width="8" height="15" rx="1.8" transform="rotate(18 12 12)" />
        <path d="M4 18c2.5 2.6 6.5 3.4 10 2" />
      </svg>
    </button>
    <div class="hint" id="hint" data-state="sealed">
      <p class="line">
        <span class="msg" data-for="sealed">キャップを押し下げて、ビー玉を落とそう</span>
        <span class="msg" data-for="closed">まずはキャップを押して開けよう</span>
        <span class="msg" data-for="open">瓶をタップでひと口。つかんで傾けるとビー玉が転がるよ</span>
        <span class="msg" data-for="blocked">ビー玉が口をふさいだ！ 凹みを下に向けると飲めるよ</span>
        <span class="msg" data-for="empty">ごちそうさま！</span>
        <span class="left" id="left"></span>
        <button type="button" id="again">新しい瓶</button>
      </p>
      <p class="sub keys">瓶をタップ・<kbd>D</kbd> でひと口 ・ 瓶をドラッグ・<kbd>←</kbd><kbd>→</kbd> で傾ける ・ まわりをドラッグで回す ・ <kbd>P</kbd> 開ける ・ <kbd>R</kbd> 新しい瓶 ・ <kbd>M</kbd> 音</p>
      <p class="sub touch">瓶をタップでひと口 ・ 左右にドラッグで傾ける ・ キャップをタップでも開くよ</p>
    </div>
    <p class="error" id="error" hidden>この端末では WebGL2 が使えないため表示できません。</p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
